name: Apply MergeBounty package

on:
  push:
    branches: [main]
    paths:
      - ".mergepkg/**"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace main with uploaded package
        shell: bash
        run: |
          set -euo pipefail
          cat .mergepkg/part-* > /tmp/package.b64
          base64 -d /tmp/package.b64 > /tmp/package.tar.xz
          echo "b7cb9e54852b568c42fbf1b31f7b6e869b8ccd98d788524c9f3b8784ad924623  /tmp/package.tar.xz" | sha256sum -c -
          mkdir -p /tmp/package
          tar -xJf /tmp/package.tar.xz -C /tmp/package
          cp .github/workflows/apply-package.yml /tmp/apply-package.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/package/MergeBounty-resubmission-ready/. .
          mkdir -p .github/workflows
          cp /tmp/apply-package.yml .github/workflows/apply-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply MergeBounty resubmission package"
          git push origin HEAD:main
