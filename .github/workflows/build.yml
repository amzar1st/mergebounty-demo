name: Build and verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify build artifact
        run: test -f dist/index.html && test -f dist/js/genlayer.js && test -f dist/css/main.css
